[include]
files = []

[include.optional]
files = ["noctalia.toml"]

# Below-Z3R0-os — Umbriel config (v6: migración COMPLETA Niri → Umbriel)
# 2026-10-03: basados en docs oficiales de Niri + Umbriel

[general]
mod_key = "super"
xwayland = true
xwayland_native_resolution = false
show_cheatsheet = false

autostart = [
    "noctalia -d",
    "/usr/lib/polkit-kde-authentication-agent-1"
]

# Keymap
[input.keyboard]
layout = "latam"
variant = ""
numlock_toggle = true

# Input (mouse, touchpad, cursor, drag-edge-scroll)
[input]
middle_click_paste = false
client_window_drag = true
window_drag_toggle = "floating"

[input.touchpad]
tap = true
natural_scroll = true
disable_while_typing = true
disable_on_external_mouse = true

[input.mouse]
natural_scroll = false
scroll_wheel_step = 60

[input.cursor]
size = 24
hardware_cursor = true

[input.drag_edge_scroll]
enabled = true
trigger_zone = 30
delay_ms = 100
max_speed = 1500.0

[input.focus]
follows_mouse = false

# Environment (Qt, KDE, SDL)
[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
SDL_VIDEODRIVER = "wayland"
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "kde"
QT_QPA_PLATFORMTHEME_QT6 = "kde"
XDG_MENU_PREFIX = "plasma-"

# Layout
[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# Colors: Rosé Pine

[hot_corners.top_right]
enabled = true
delay_ms = 500
action = "spawn:noctalia msg panel-toggle notifications"

[hot_corners.bottom_left]
enabled = true
delay_ms = 500
action = "spawn:noctalia msg panel-toggle launcher"

[hot_corners.bottom_right]
enabled = true
delay_ms = 500
action = "spawn:noctalia msg panel-toggle control-center"

# Layer rules
[[layer_rule]]
match.namespace = "^kitty$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

# Window rules
[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^firefox$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = "^org[.]vinegarhq[.]Sober$"
default_floating = true
default_position = { x = 100, y = 100 }
border_width = 0
shadow = false

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.app_id = "^vesktop$"
border_color_focused = "#ebbcbaff"

[[window_rule]]
match.app_id = "^code$"
border_color_focused = "#9ccfd8ff"

[[window_rule]]
match.app_id = "^org[.]pulseaudio[.]pavucontrol$"
default_floating = true
default_floating_size = { width = 0.5, height = 0.6 }

[[window_rule]]
match.app_id = "^blueman-manager$"
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
default_fullscreen = true

[[window_rule]]
match.app_id = "^steam_app_.*$"
default_workspace = 4
default_fullscreen = true
vrr = "always"
confine_pointer = true

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#31748fff"
border_color_unfocused = "#112f3cff"

# Scratchpads
[[scratchpad]]
name = "terminal"
spawn_when_empty = "kitty"

[[scratchpad]]
name = "music"

# KEYBINDS — MIGRACIÓN 1-a-1 NIRI → UMBRIEL
[keybinds]

# APPS
"Mod+T"           = { action = "spawn:kitty", repeat = false }
"Control+Alt+T"   = { action = "spawn:kitty", repeat = false }
"Alt+grave"       = { action = "spawn:kitty", repeat = false }
"Mod+Space"       = "spawn:noctalia msg panel-toggle launcher"
"Mod+Shift+B"     = "spawn:noctalia msg bar-toggle"
"F12"             = "spawn:noctalia msg bar-toggle"
"Mod+Shift+S"     = { action = "spawn:$HOME/.local/bin/satty-wrap gui", repeat = false }
"Print"           = { action = "spawn:$HOME/.local/bin/satty-wrap gui", repeat = false }
"Ctrl+Print"      = "spawn:grim screenshot.png"
"Alt+Print"       = "spawn:grim -g $(slurp) - | wl-copy"
"Mod+Shift+O"     = "spawn:$HOME/.local/bin/ocr-region.sh"
"Control+Shift+O" = "spawn:$HOME/.local/bin/ocr-region.sh"

# LOCK + ORCA
"Mod+Alt+L"     = "spawn:noctalia-greeter-session"
"Control+Alt+L" = "spawn:noctalia-greeter-session"
"Mod+Alt+S"     = "spawn:pkill orca || exec orca"
"Control+Alt+S" = "spawn:pkill orca || exec orca"

# MULTIMEDIA
"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-", allow_when_locked = true }
"XF86AudioMute"        = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute"     = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86AudioPlay"        = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioStop"        = { action = "spawn:playerctl stop", allow_when_locked = true }
"XF86AudioPrev"        = { action = "spawn:playerctl previous", allow_when_locked = true }
"XF86AudioNext"        = { action = "spawn:playerctl next", allow_when_locked = true }
"XF86MonBrightnessUp"   = { action = "spawn:brightnessctl --class=backlight set +10%", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:brightnessctl --class=backlight set 10%-", allow_when_locked = true }

# OVERVIEW / CLOSE / CHEATSHEET
"Mod+O"           = { action = "overview-toggle", repeat = false }
"F11"             = { action = "overview-toggle", repeat = false }
"Mod+Q"           = { action = "window-close", repeat = false }
"Mod+W"           = { action = "window-close", repeat = false }
"Mod+Ctrl+Alt+K"  = "cheatsheet-toggle"
"Mod+Shift+E"     = "session-quit:skip-confirmation"
"Control+Alt+Delete" = "session-quit:skip-confirmation"
"Mod+Shift+P"     = "dpms-off"
"Mod+Escape"      = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# FOCUS WINDOW
"Mod+Left"  = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up"    = "window-focus-up"
"Mod+Down"  = "window-focus-down"
"Mod+H"     = "window-focus-left"
"Mod+J"     = "window-focus-down"
"Mod+K"     = "window-focus-up"
"Mod+L"     = "window-focus-right"

# MOVE WINDOW
"Mod+Ctrl+Left"  = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+Up"    = "window-move-up"
"Mod+Ctrl+Down"  = "window-move-down"
"Mod+Ctrl+H"     = "column-move-left"
"Mod+Ctrl+J"     = "window-move-down"
"Mod+Ctrl+K"     = "window-move-up"
"Mod+Ctrl+L"     = "column-move-right"

# CONSUME/EXPEL
"Mod+BracketLeft"  = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"

# WINDOW STATE
"Mod+V"       = "window-toggle-floating"
"Mod+Shift+V" = "window-focus-switch-floating"
"Mod+F"       = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+M"       = "window-toggle-maximize-to-edges"
"Mod+Ctrl+F"  = "window-toggle-maximize"
"Mod+C"       = "column-center"
"Mod+Ctrl+C"  = "column-center"
"Mod+P"       = { action = "window-toggle-pinned", repeat = false }

# COLUMN FIRST/LAST
"Mod+Home"      = "column-focus-first"
"Mod+End"       = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End"  = "column-move-to-last"

# COLUMN WIDTH
"Mod+R"           = "window-cycle-primary-extent"
"Mod+Shift+R"     = "window-cycle-primary-extent-back"
"Mod+Ctrl+Shift+R" = "window-cycle-secondary-extent"
"Mod+Minus"       = "window-modify-primary-extent:-0.1"
"Mod+Equal"       = "window-modify-primary-extent:0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent:0.1"
"Mod+Alt+R" = "window-set-primary-extent:0.5"      # Reset width a 50% (equivalente a Mod+Ctrl+R de Niri)
"Mod+Alt+Shift+R" = "window-set-secondary-extent:0.5"  # Reset height a 50%

# FOCUS MONITOR
"Mod+Shift+Left"  = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up"    = "output-focus-up"
"Mod+Shift+Down"  = "output-focus-down"
"Mod+Shift+H"     = "output-focus-left"
"Mod+Shift+J"     = "output-focus-down"
"Mod+Shift+K"     = "output-focus-up"
"Mod+Shift+L"     = "output-focus-right"

# MOVE COLUMN TO MONITOR
"Mod+Shift+Ctrl+Left"  = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+Up"    = "column-move-to-output-up"
"Mod+Shift+Ctrl+Down"  = "column-move-to-output-down"
"Mod+Shift+Ctrl+H"     = "column-move-to-output-left"
"Mod+Shift+Ctrl+J"     = "column-move-to-output-down"
"Mod+Shift+Ctrl+K"     = "column-move-to-output-up"
"Mod+Shift+Ctrl+L"     = "column-move-to-output-right"

# FOCUS WORKSPACE
"Mod+U"          = "workspace-previous"
"Mod+I"          = "workspace-next"
"Mod+Page_Up"    = "workspace-previous"
"Mod+Page_Down"  = "workspace-next"
"Mod+Shift+U"    = "workspace-move-down"
"Mod+Shift+I"    = "workspace-move-up"

# Move column to workspace
"Mod+Ctrl+U"     = "column-move-to-workspace-previous"
"Mod+Ctrl+I"     = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up"   = "column-move-to-workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"

# SWITCH WORKSPACE BY NUMBER
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+0" = "workspace-switch:10"

# MOVE WINDOW TO WORKSPACE BY NUMBER
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Shift+0" = "window-move-to-workspace:10"

# SCRATCHPADS
"Mod+Shift+Space" = { action = "window-move-to-scratchpad:terminal", repeat = false }
"Mod+Ctrl+Space"  = { action = "window-restore-from-scratchpad:terminal", repeat = false }
"Mod+Tab"         = "scratchpad-toggle:terminal"

# WHEEL NAVIGATION (Niri: Mod+WheelScrollDown/Up = focus-workspace)
"Mod+WheelDown" = "workspace-next"
"Mod+WheelUp"   = "workspace-previous"
"Mod+Shift+WheelDown" = "window-focus-down"
"Mod+Shift+WheelUp"   = "window-focus-up"

