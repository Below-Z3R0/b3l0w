swap_pct_activity_threshold = 20.0
swap_pct_critical_threshold = 80.0

[theme]
builtin = "Rosé Pine"
community_palette = "ADW"
custom_palette = ""
mode = "dark"
pure_black_dark = false
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "umbriel" ]
    community_ids = [
        "fastfetch.disabled",
        "libreoffice.disabled",
        "chromium-based",
        "zen-browser",
        "discord",
        "libreoffice",
        "micro",
        "neovim",
        "obsidian",
        "vscode",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "fuzzel",
        "fastfetch",
        "obs",
        "konsole",
        "lazygit"
    ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.hermes]
        hook_async = false
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/hermes-skin.yaml"
        output_path = "$XDG_STATE_HOME/noctalia/hermes/hermes-skin.yaml"
        post_hook = "bash '~/.config/noctalia/templates/apply.sh'"

        [theme.templates.user.seanime]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/palette.css"
        output_path = "$XDG_STATE_HOME/noctalia/seanime/palette.css"

[wallpaper]
directory = ""
directory_dark = ""
directory_light = ""
edge_smoothness = 0.30000001192092896
enabled = true
fill_color = ""
fill_mode = "crop"
per_monitor_directories = false
transition = [ "zoom" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = false
    interval_seconds = 1800
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/satty-20261012-223316.png"

    [wallpaper.last]
    path = "~/.local/state/noctalia/plugins/data/b3l0w/wallpaper/wallhaven/je17z5.png"

    [wallpaper.monitor.eDP-1]
    fill_color = "primary"

    [wallpaper.monitors.HDMI-A-1]
    path = "~/.cache/noctalia/mpvpaper/_home_b3low_z3r0_Videos_wallpapers_wl2_miku_mp4.jpg"

    [wallpaper.monitors.eDP-1]
    path = "~/.local/state/noctalia/plugins/data/b3l0w/wallpaper/wallhaven/je17z5.png"

    [wallpaper.monitors.winit]
    path = "~/.cache/noctalia/mpvpaper/_home_b3low_z3r0_Videos_wallpapers_Campfire_PC_mp4.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Rosé Pine"
    palette_source = "builtin"
    path = "~/Pictures/Wallpapers/satty-20261012-223403.png"
    theme_mode = "light"

    [[wallpaper.favorite]]
    builtin_palette = "Rosé Pine"
    palette_source = "builtin"
    path = "~/Pictures/Wallpapers/satty-20261012-223316.png"
    theme_mode = "dark"

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "metric"

[widget.active_window]
icon_size = 14.0
max_length = 260.0
min_length = 80.0
title_scroll = "none"
type = "active_window"

[widget.bar_2]
type = "prponkshe/umbriel-displays:bar"

[widget.bar_3]
type = "noctalia/umbriel-companion:bar"

[widget.battery]
show_label = false

[widget.bluetooth]
color = "primary"

[widget.brightness]
icon_color = "secondary"
show_label = false

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clock]
anchor = true
scale = 1.25

[widget.control-center]
glyph = "octagon-filled"
scale = 2.5

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.hover_clipboard]
panel = "clipboard"
type = "user/hover-zones:hover_zone"

[widget.hover_control]
anchor = true
close_on_leave = true
context = "home"
panel = "control-center"
type = "user/hover-zones:hover_zone"

[widget.hover_phone]
panel = "icefish/phone-operate:main"
scale = 0.60000000000000009
type = "user/hover-zones:hover_zone"

[widget.hover_zone]
panel = "nightwatch75/todo:panel"
scale = 0.60000000000000009
type = "user/hover-zones:hover_zone"

[widget.hover_zone_2]
panel = "ahmedhossamdev/sticky-notes:panel"
scale = 0.60000000000000009
type = "user/hover-zones:hover_zone"

[widget.hover_zone_3]
anchor = true
panel = "b3l0w/wallpaper:panel"
type = "user/hover-zones:hover_zone"

[widget.igpu_button]
color = "primary"
type = "user/igpu-power:button"

[widget.input_volume]
device = "input"
type = "volume"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.launcher]
enabled = false

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 16.0
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network]
icon_color = "tertiary"
show_label = false
show_vpn_label = true

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
color = "primary"
label_show_units = false
stat = "ram_used"
type = "sysmon"

[widget.session]
color = "error"

[widget.spacer]
interactive = false
type = "spacer"

[widget.temp]
color = "secondary"
label_show_units = false
stat = "cpu_temp"
type = "sysmon"

[widget.theme_mode.actions]
scroll_down = "theme-mode-toggle"
scroll_up = "theme-mode-toggle"

[widget.tray]
capsule = true
capsule_opacity = 0.0
capsule_radius = 30
drawer = true
drawer_columns = 4
drawer_item_size = 25.0
hide_passive = false
match_adjacent_spacing = true

[widget.volume]
icon_color = "tertiary"
show_label = false

[widget.widget]
type = "b3l0w/net:widget"

[widget.widget_2]
type = "b3l0w/audio:widget"

[widget.widget_3]
type = "b3l0w/kanban:widget"

[widget.widget_4]
type = "b3l0w/audit:widget"

[widget.widget_5]
type = "b3l0w/anilist:widget"

[widget.widget_6]
type = "b3l0w/wallpaper:widget"

[widget.widget_7]
type = "b3l0w/containers:widget"

[widget.workspaces]
anchor = true
monitors = [ "*" ]
scale = 1.5
show_tooltip = false
style = "focus_hint"

[[widget.igpu_power]]
command = "b3l0w plugin-exec igpu-power-menu menu"
glyph = "memory"
interval_seconds = 30
middle_command = ""
right_command = ""
scroll_down_command = ""
scroll_up_command = ""
tooltip = "iGPU Power Profile"
type = "custom_button"
